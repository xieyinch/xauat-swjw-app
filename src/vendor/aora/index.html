<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    * { box-sizing: border-box; }
    html, body, #pet { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #pet { display: flex; align-items: center; justify-content: center; padding: 3px; }
    #pet > svg { width: 100% !important; height: 100% !important; filter: drop-shadow(0 5px 5px rgba(152, 83, 19, .24)); }
  </style>
</head>
<body>
  <div id="pet"></div>
  <script src="rings.js"></script>
  <script src="emotions.js"></script>
  <script src="ball.js"></script>
  <script src="engine.js"></script>
  <script>
    (function () {
      var pet = EmotionBall.create(document.getElementById('pet'), {
        emotion: '02', shape: 'blob', color: '#F2A12C', eyeColor: '#FFFDF4',
        eyeScale: 1.65, idle: true, lite: true
      });
      function receive(event) {
        try {
          var message = JSON.parse(event.data || '{}');
          if (message.emotion) pet.setEmotion(message.emotion);
          if (message.bounce) pet.bounce();
        } catch (_) {}
      }
      document.addEventListener('message', receive);
      window.addEventListener('message', receive);
      window.ReactNativeWebView.postMessage('ready');
    })();
  </script>
</body>
</html>
